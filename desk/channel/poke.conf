# Roster and destination for scheduled pokes. Edit this file, never the script.
# The roster is CONFIG: adding, removing or reordering agents is a one line
# change that ships without touching any work logic. Order does not matter,
# because the first agent to answer claims the cycle.
CHANNEL=rolling-pin-supplier-desk
ROSTER="agent-north agent-south agent-relief"
# Optional. Only a throwaway test channel should ever set this: a poke that
# mentions nobody wakes nobody.
# ALLOW_EMPTY_ROSTER=1
